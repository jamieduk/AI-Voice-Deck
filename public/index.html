<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#121212" />
  <meta name="color-scheme" content="dark" />
  <title>AI Voice Desk</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%234CAF50'/%3E%3Crect x='14' y='8' width='4' height='11' rx='2' fill='%23121212'/%3E%3Cpath d='M11 18a5 5 0 0 0 10 0' stroke='%23121212' stroke-width='2' fill='none'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="app-shell" class="app-shell">
    <!-- ===================== Sidebar ===================== -->
    <aside id="sidebar" class="sidebar" aria-label="Conversations">
      <div class="sidebar-head">
        <button id="new-conversation" class="btn btn-primary btn-full" type="button">
          <span class="btn-ico" aria-hidden="true">+</span> New conversation
        </button>
        <div class="search-wrap">
          <input id="search-input" class="input" type="search" placeholder="Search conversations" aria-label="Search conversations" autocomplete="off" />
        </div>
      </div>
      <div id="conversation-list" class="conversation-list" role="list" aria-live="polite"></div>
      <div class="sidebar-foot">
        <button id="toggle-text-mode" class="btn btn-ghost btn-full" type="button" aria-pressed="false">Text-only mode: off</button>
      </div>
    </aside>

    <div id="sidebar-scrim" class="scrim" hidden></div>

    <!-- ===================== Main ===================== -->
    <main class="main">
      <header class="topbar">
        <button id="menu-toggle" class="btn btn-icon" type="button" aria-label="Toggle conversation list" aria-expanded="false">☰</button>
        <div class="brand">
          <span class="brand-dot" aria-hidden="true"></span>
          <div class="brand-text">
            <strong id="conv-title">New conversation</strong>
            <span id="model-label" class="muted">No model</span>
          </div>
        </div>
        <div class="topbar-actions">
          <span id="conn-dot" class="conn-dot conn-unknown" title="Connection status" aria-hidden="true"></span>
          <button id="open-settings" class="btn btn-icon" type="button" aria-label="Open settings">⚙</button>
        </div>
      </header>

      <section class="status-row" aria-live="polite">
        <span id="status-pill" class="status-pill status-idle" data-state="idle">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="status-text">Ready</span>
        </span>
        <span id="status-detail" class="status-detail muted"></span>
      </section>

      <div id="conversation" class="conversation" role="log" aria-live="polite" aria-relevant="additions text">
        <div id="empty-state" class="empty-state">
          <h2>Start talking</h2>
          <p>Hold the microphone button to talk, or type a message below. Set up your AI endpoint in Settings first.</p>
        </div>
      </div>

      <div class="wave-wrap" aria-hidden="true">
        <canvas id="waveform" class="waveform" width="600" height="56"></canvas>
      </div>

      <!-- ===================== Composer ===================== -->
      <form id="composer" class="composer" autocomplete="off">
        <div class="composer-input">
          <textarea id="message-input" class="input textarea" rows="1" placeholder="Type a message…" aria-label="Message"></textarea>
        </div>
        <button id="send-btn" class="btn btn-primary btn-send" type="submit" aria-label="Send message">
          <span aria-hidden="true">➤</span>
        </button>
      </form>

      <section class="controls" aria-label="Voice controls">
        <div class="control-group control-group-main">
          <button id="ptt-btn" class="btn mic-btn" type="button" aria-pressed="false" aria-label="Hold to talk">
            <span class="mic-ico" aria-hidden="true">🎙</span>
            <span class="mic-label" id="ptt-label">Hold to talk</span>
          </button>
          <button id="mode-toggle" class="btn btn-ghost" type="button" aria-pressed="false" title="Switch between push-to-talk and continuous listening">
            Mode: Push-to-talk
          </button>
        </div>
        <div class="control-group control-group-aux">
          <button id="mute-btn" class="btn btn-icon" type="button" aria-pressed="false" aria-label="Mute assistant speech" title="Mute assistant speech">🔊</button>
          <button id="stop-btn" class="btn btn-icon" type="button" aria-label="Stop speaking and cancel request" title="Stop">⏹</button>
          <button id="replay-btn" class="btn btn-icon" type="button" aria-label="Replay last response" title="Replay last response">🔁</button>
          <button id="clear-btn" class="btn btn-icon" type="button" aria-label="Clear conversation" title="Clear conversation">🗑</button>
        </div>
      </section>
    </main>
  </div>

  <!-- ===================== Login overlay ===================== -->
  <div id="login-overlay" class="overlay" hidden>
    <div class="modal modal-sm" role="dialog" aria-modal="true" aria-labelledby="login-title">
      <h2 id="login-title">Sign in</h2>
      <p class="muted">This server requires a password for remote access.</p>
      <form id="login-form">
        <label class="field">
          <span>Password</span>
          <input id="login-password" class="input" type="password" autocomplete="current-password" required />
        </label>
        <p id="login-error" class="error-text" role="alert" hidden></p>
        <div class="modal-actions">
          <button class="btn btn-primary" type="submit">Sign in</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===================== Settings modal ===================== -->
  <div id="settings-overlay" class="overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <header class="modal-head">
        <h2 id="settings-title">Settings</h2>
        <button id="close-settings" class="btn btn-icon" type="button" aria-label="Close settings">✕</button>
      </header>

      <div class="modal-body">
        <nav class="tabs" role="tablist" aria-label="Settings sections">
          <button class="tab is-active" role="tab" aria-selected="true" data-tab="ai" type="button">AI</button>
          <button class="tab" role="tab" aria-selected="false" data-tab="voice" type="button">Voice</button>
          <button class="tab" role="tab" aria-selected="false" data-tab="speech" type="button">Speech</button>
          <button class="tab" role="tab" aria-selected="false" data-tab="general" type="button">General</button>
        </nav>

        <section class="tab-panel is-active" data-panel="ai">
          <label class="field"><span>Provider name</span>
            <input id="set-ai-provider" class="input" type="text" placeholder="OpenAI-compatible" />
          </label>
          <label class="field"><span>Base URL</span>
            <input id="set-ai-url" class="input" type="url" placeholder="https://api.openai.com/v1" />
          </label>
          <label class="field"><span>Model</span>
            <input id="set-ai-model" class="input" type="text" placeholder="gpt-4o-mini" />
          </label>
          <label class="field"><span>API key</span>
            <input id="set-ai-key" class="input" type="password" placeholder="Leave blank to keep current" autocomplete="off" />
            <small id="ai-key-hint" class="muted"></small>
          </label>
          <label class="field"><span>Request timeout (ms)</span>
            <input id="set-ai-timeout" class="input" type="number" min="1000" max="600000" step="1000" />
          </label>
          <div class="field-row">
            <button id="test-ai" class="btn btn-ghost" type="button">Test connection</button>
            <span id="test-ai-result" class="inline-result" role="status"></span>
          </div>
        </section>

        <section class="tab-panel" data-panel="voice">
          <label class="field"><span>Voice input mode</span>
            <select id="set-voice-mode" class="input">
              <option value="ptt">Push-to-talk</option>
              <option value="continuous">Continuous listening</option>
            </select>
          </label>
          <label class="field"><span>Microphone</span>
            <select id="set-mic-device" class="input"><option value="">System default</option></select>
          </label>
          <label class="checkbox field">
            <input id="set-auto-speak" type="checkbox" />
            <span>Speak assistant replies automatically</span>
          </label>
          <label class="checkbox field">
            <input id="set-browser-transcription" type="checkbox" />
            <span>Use browser speech recognition when available</span>
          </label>
          <p class="muted small">
            Browser support detected: <span id="browser-capabilities">checking…</span>
          </p>

          <h3 class="section-title">Transcription fallback</h3>
          <label class="field"><span>Endpoint base URL</span>
            <input id="set-tr-url" class="input" type="url" placeholder="https://api.openai.com/v1" />
          </label>
          <label class="field"><span>API style</span>
            <select id="set-tr-style" class="input">
              <option value="openai">OpenAI-compatible (/audio/transcriptions)</option>
              <option value="whisper.cpp">whisper.cpp server (/inference)</option>
            </select>
          </label>
          <label class="field"><span>Model</span>
            <input id="set-tr-model" class="input" type="text" placeholder="whisper-1" />
          </label>
          <label class="field"><span>API key</span>
            <input id="set-tr-key" class="input" type="password" placeholder="Leave blank to keep current" autocomplete="off" />
            <small id="tr-key-hint" class="muted"></small>
          </label>
          <div class="field-row">
            <button id="test-tr" class="btn btn-ghost" type="button">Test transcription endpoint</button>
            <span id="test-tr-result" class="inline-result" role="status"></span>
          </div>
        </section>

        <section class="tab-panel" data-panel="speech">
          <label class="field"><span>Speech provider</span>
            <select id="set-tts-provider" class="input">
              <option value="browser">Browser (built-in)</option>
              <option value="api">External API</option>
              <option value="piper">Local Piper</option>
            </select>
          </label>
          <div id="tts-piper-fields" style="display:none">
            <label class="field"><span>Piper executable</span>
              <input id="set-piper-path" class="input" type="text" placeholder="/path/to/piper" />
            </label>
            <label class="field"><span>Voice model (.onnx)</span>
              <input id="set-piper-voice" class="input" type="text" placeholder="/path/to/voice.onnx" />
            </label>
            <div class="field-row">
              <button id="test-tts" class="btn btn-ghost" type="button">Test speech endpoint</button>
              <span id="test-tts-result" class="inline-result" role="status"></span>
            </div>
          </div>
          <div id="tts-api-fields">
            <label class="field"><span>Endpoint base URL</span>
              <input id="set-tts-url" class="input" type="url" placeholder="https://api.openai.com/v1" />
            </label>
            <label class="field"><span>Model</span>
              <input id="set-tts-model" class="input" type="text" placeholder="tts-1" />
            </label>
            <label class="field"><span>Voice</span>
              <input id="set-tts-voice" class="input" type="text" placeholder="alloy" />
            </label>
            <label class="field"><span>API key</span>
              <input id="set-tts-key" class="input" type="password" placeholder="Leave blank to keep current" autocomplete="off" />
              <small id="tts-key-hint" class="muted"></small>
            </label>
            <div class="field-row">
              <button id="test-tts" class="btn btn-ghost" type="button">Test speech endpoint</button>
              <span id="test-tts-result" class="inline-result" role="status"></span>
            </div>
          </div>
          <div id="tts-browser-fields">
            <label class="field"><span>Browser voice</span>
              <select id="set-browser-voice" class="input"><option value="">Default</option></select>
            </label>
          </div>
          <label class="field"><span>Rate: <span id="rate-value">1.0</span></span>
            <input id="set-rate" class="input range" type="range" min="0.5" max="2" step="0.1" value="1" />
          </label>
          <label class="field"><span>Pitch: <span id="pitch-value">1.0</span></span>
            <input id="set-pitch" class="input range" type="range" min="0" max="2" step="0.1" value="1" />
          </label>
          <label class="field"><span>Volume: <span id="vol-value">1.0</span></span>
            <input id="set-volume" class="input range" type="range" min="0" max="1" step="0.05" value="1" />
          </label>
        </section>

        <section class="tab-panel" data-panel="general">
          <label class="field"><span>System prompt</span>
            <textarea id="set-system-prompt" class="input textarea" rows="5"></textarea>
          </label>
          <label class="field"><span>Conversation retention (days, 0 = keep forever)</span>
            <input id="set-retention" class="input" type="number" min="0" max="3650" step="1" />
          </label>
          <label class="field"><span>Accent colour</span>
            <input id="set-accent" class="input color" type="color" value="#4CAF50" />
          </label>
          <div class="field-row">
            <button id="export-txt" class="btn btn-ghost" type="button">Export TXT</button>
            <button id="export-json" class="btn btn-ghost" type="button">Export JSON</button>
            <button id="logout-btn" class="btn btn-ghost" type="button" hidden>Sign out</button>
          </div>
        </section>
      </div>

      <footer class="modal-foot">
        <span id="settings-status" class="inline-result" role="status"></span>
        <div class="modal-actions">
          <button id="cancel-settings" class="btn btn-ghost" type="button">Cancel</button>
          <button id="save-settings" class="btn btn-primary" type="button">Save</button>
        </div>
      </footer>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/audio.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
